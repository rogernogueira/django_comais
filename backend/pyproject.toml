[project]
name = "comais-backend"
version = "0.1.0"
description = "COMAIS Labs management system - Django backend (REST API)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "django==4.1.1",
    "django-cors-headers>=4.5.0",
    "django-filter>=23.5",
    "django-reset-migrations==0.4.0",
    "django-tinymce==3.5.0",
    "djangorestframework>=3.15.1",
    "docxtpl==0.16.4",
    "drf-spectacular>=0.29.0",
    "html2markdown==0.1.7",
    "mysqlclient==2.1.1",
    "pillow==9.2.0",
    "python-dotenv>=1.2.2",
]

[tool.uv]
package = false
